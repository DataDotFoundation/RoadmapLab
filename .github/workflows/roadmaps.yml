name: roadmaps

# The AI-roadmap space: every roadmap under Roadmaps/ has a valid arXiv topic, and every
# Roadmaps/*/Suggested.lean elaborates at the pins (TauCetiRoadmap's), with no error and no
# warning other than `declaration uses sorry`. A roadmap PR merges only when this passes and the
# repository owner merges it.

on:
  pull_request:
    paths: ["Roadmaps/**", "lakefile.toml", "lake-manifest.json", "lean-toolchain", "cert1/**"]
  push:
    branches: [main]
    paths: ["Roadmaps/**", "lakefile.toml", "lake-manifest.json", "lean-toolchain", "cert1/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Topics
        run: python3 .github/scripts/check_roadmap_topics.py
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Elaborate every Roadmaps/*/Suggested.lean
        run: bash cert1/cert1.sh . "$RUNNER_TEMP/roadmaps" 'Roadmaps/*/Suggested.lean'
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/roadmaps/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
